apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: 'https://nirmata.github.io/kyverno-charts/' ## kyverno helm chart
    chart: kyverno
    targetRevision: 3.3.27
    helm:
      valueFiles:
      - $values/kyverno/values.yaml
  - repoURL: 'https://github.com/nirmata/onboard-n4k-argo.git'
    targetRevision: c-fix-argo-reports-server-1.13
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
