apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nirmata-kube-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nirmata/onboard-n4k-argo.git
    targetRevision: g-argo-v1.11.4
    path: v1.11/nirmata-kube-controller
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nirmata
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
  - group: ""
    kind: ConfigMap
    name: otel-agent-config
    namespace: nirmata
    jsonPointers:
    - /data/config.yaml
    - /metadata/annotations
    - /metadata/resourceVersion
  - group: apps
    kind: Deployment
    namespace: nirmata
    jsonPointers:
    - /metadata/annotations
    - /metadata/resourceVersion
    - /metadata/generation
    - /status
  - group: ""
    kind: ServiceAccount
    namespace: nirmata
    jsonPointers:
    - /metadata/annotations
    - /metadata/resourceVersion
    - /secrets
